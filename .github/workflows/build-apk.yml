name: Build KEA Pro APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android platform project
        working-directory: mobile
        run: flutter create --platforms=android --project-name kea_pro .

      - name: Prepare client configuration file
        working-directory: mobile
        run: cp lib/app_config.example.dart lib/app_config.dart
      - name: Validate Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Missing repository secret SUPABASE_URL"
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[A-Za-z0-9-]+\.supabase\.co/?$ ]]; then
            echo "::error::SUPABASE_URL must be your actual Supabase HTTPS project URL"
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY//[[:space:]]/}" || "$SUPABASE_ANON_KEY" == *YOUR_SUPABASE* ]]; then
            echo "::error::Missing or placeholder SUPABASE_ANON_KEY"
            exit 1
          fi
          if [[ "$SUPABASE_ANON_KEY" == *service_role* ]]; then
            echo "::error::Never use a service_role key in the client app"
            exit 1
          fi
          echo "Supabase build configuration is present."
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: mobile
        run: flutter test
      - name: Build release APK
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KEA-Pro-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
